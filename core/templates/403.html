<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied | MediCore</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <style>
        body {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container">
        <div
            class="row justify-content-center align-items-center"
            style="min-height: 100vh;"
        >
            <div class="col-sm-10 col-md-7 col-lg-5 text-center">

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5">

                        <h1 class="fw-bold text-danger mb-3">403</h1>

                        <h4 class="fw-semibold mb-2">Access denied</h4>

                        <p class="text-muted mb-4">
                            {% if exception %}
                                {{ exception }}
                            {% else %}
                                You don't have permission to view this page.
                            {% endif %}
                        </p>

                        <a href="{% url 'core:dashboard' %}" class="btn btn-primary">
                            Back to dashboard
                        </a>

                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
